name: Account security audit

on:
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit repository security metadata
        env:
          GH_TOKEN: ${{ secrets.ACCOUNT_SECURITY_AUDIT_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure the dedicated read-only ACCOUNT_SECURITY_AUDIT_TOKEN described in SECURITY_BASELINE.md."
            exit 2
          fi
          python3 scripts/security_audit.py --owner jonathanperis
